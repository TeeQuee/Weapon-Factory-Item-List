<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weapon Factory — Value List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121018;
    --bg-deep: #0c0b12;
    --panel: #1a1723;
    --panel-2: #201c2c;
    --line: #2c2740;
    --line-soft: #241f30;
    --text: #f1ecff;
    --muted: #948dab;
    --muted-2: #6f6884;
    --gold: #f0b429;
    --gold-dim: #6b551f;
    --gem: #3fd6c6;
    --gem-dim: #1e5651;
    --danger: #e5637a;

    --c-weapons: #e0566b;
    --c-items: #3fd6c6;
    --c-cards: #b28bf7;
    --c-artifacts: #f0b429;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 90% -10%, #241a3455, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #1a2b2f55, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--gem-dim);}
  .num{font-family:'JetBrains Mono',monospace;}

  /* ---------- App shell ---------- */
  .app{display:flex; flex-direction:column; min-height:100vh;}

  .topbar{
    display:flex; align-items:center; gap:20px;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#171320,#13111a);
    position:sticky; top:0; z-index:30;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--gold),#c98a1c);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;color:#1a1300;font-size:17px;
    box-shadow:0 4px 14px -4px #f0b42966;
  }
  .brand-text h1{
    font-family:'Baloo 2'; font-weight:700; font-size:18px; margin:0; line-height:1.1;
  }
  .brand-text span{font-size:11.5px; color:var(--muted); letter-spacing:.02em;}

  .rate-box{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:8px 8px 8px 14px;
  }
  .rate-box label{font-size:12px; color:var(--muted); white-space:nowrap;}
  .rate-box .eq{color:var(--muted-2); font-size:13px;}
  .rate-box input{
    width:118px; background:var(--bg-deep); border:1px solid var(--line);
    border-radius:8px; color:var(--gem); font-family:'JetBrains Mono'; font-weight:700;
    padding:7px 9px; font-size:13.5px; outline:none;
  }
  .rate-box input:focus{border-color:var(--gem);}
  .rate-chip{
    font-size:11px; color:var(--gem); background:var(--gem-dim); opacity:.55;
    padding:5px 8px; border-radius:7px; font-family:'JetBrains Mono';
  }

  .btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    padding:9px 15px; border-radius:10px; font-weight:600; font-size:13.5px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:border-color .15s, transform .1s;
    font-family:'Inter';
  }
  .btn:hover{border-color:#463d63;}
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:linear-gradient(180deg,#f5c451,var(--gold)); color:#221800; border:none; font-weight:700;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--danger); border-color:#4a2530;}
  .btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px;}

  /* ---------- Layout ---------- */
  .body-grid{display:flex; flex:1; min-height:0;}
  .sidebar{
    width:232px; flex-shrink:0; border-right:1px solid var(--line);
    padding:18px 12px; background:var(--bg-deep);
  }
  .cat-group{margin-bottom:6px;}
  .cat-btn{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:11px 12px; border-radius:10px; font-family:'Baloo 2'; font-weight:600;
    font-size:15px; cursor:pointer; display:flex; align-items:center; gap:10px;
    letter-spacing:.01em;
  }
  .cat-btn .dot{width:8px;height:8px;border-radius:50%; flex-shrink:0;}
  .cat-btn:hover{background:var(--panel);}
  .cat-btn.active{background:var(--panel-2);}
  .subcat-list{padding:2px 0 10px 30px; display:none;}
  .cat-group.open .subcat-list{display:block;}
  .subcat-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; text-align:left; background:none; border:none; color:var(--muted);
    padding:7px 10px; border-radius:8px; font-size:13px; cursor:pointer; margin:1px 0;
  }
  .subcat-btn:hover{color:var(--text); background:var(--panel);}
  .subcat-btn.active{color:var(--text); background:var(--panel-2); font-weight:600;}
  .subcat-btn .count{font-family:'JetBrains Mono'; font-size:10.5px; color:var(--muted-2);}

  .main{flex:1; min-width:0; padding:22px 26px 60px; overflow-y:auto;}
  .main-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .crumb{font-size:12px; color:var(--muted-2); margin-bottom:4px;}
  .main-head h2{font-family:'Baloo 2'; font-size:26px; margin:0; font-weight:700;}
  .head-actions{display:flex; gap:10px; align-items:center;}
  .search{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:9px 13px; color:var(--text); font-size:13.5px; width:210px; outline:none;
  }
  .search:focus{border-color:#463d63;}

  .empty-state{
    border:1.5px dashed var(--line); border-radius:16px; padding:46px 20px;
    text-align:center; color:var(--muted); margin-top:10px;
  }
  .empty-state b{color:var(--text); display:block; font-family:'Baloo 2'; font-size:16px; margin-bottom:6px;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:14px;
  }

  .card{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:14px; cursor:pointer; transition:border-color .15s, transform .12s;
  }
  .card:hover{border-color:var(--accent,#463d63); transform:translateY(-2px);}
  .card .badges{display:flex; gap:5px; position:absolute; top:10px; right:10px;}
  .badge-shiny{
    font-size:9.5px; font-weight:700; color:#1a1300; background:linear-gradient(135deg,#fff2b0,var(--gold));
    padding:2px 6px; border-radius:6px; letter-spacing:.03em;
  }
  .card-name{font-family:'Baloo 2'; font-weight:600; font-size:14.5px; line-height:1.25; margin:2px 0 10px; padding-right:34px;}
  .card-values{display:flex; flex-direction:column; gap:4px;}
  .val-row{display:flex; align-items:center; justify-content:space-between; font-size:12px;}
  .val-row .lbl{color:var(--muted); display:flex; align-items:center; gap:5px;}
  .val-row .amt{font-family:'JetBrains Mono'; font-weight:700; font-size:12.5px;}
  .amt-gem{color:var(--gem);}
  .amt-gold{color:var(--gold);}
  .swatch{width:7px;height:7px;border-radius:50%;}

  /* ---------- Tooltip ---------- */
  .tip{
    position:fixed; z-index:100; width:230px; pointer-events:none;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; box-shadow:0 14px 34px -10px #000000aa;
    opacity:0; transform:translateY(4px); transition:opacity .1s, transform .1s;
  }
  .tip.show{opacity:1; transform:translateY(0);}
  .tip h4{margin:0 0 8px; font-family:'Baloo 2'; font-size:14px;}
  .tip .stat-row{display:flex; justify-content:space-between; font-size:12px; padding:3px 0; color:var(--muted);}
  .tip .stat-row b{color:var(--text); font-family:'JetBrains Mono'; font-weight:600;}
  .tip hr{border:none; border-top:1px solid var(--line); margin:8px 0;}
  .tip .total{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700;}
  .tip .total b{color:var(--gem); font-family:'JetBrains Mono';}
  .tip .none{font-size:11.5px; color:var(--muted-2); font-style:italic;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:#08070ccc; backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px;
  }
  .modal h3{font-family:'Baloo 2'; margin:0 0 16px; font-size:19px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select{
    width:100%; background:var(--bg-deep); border:1px solid var(--line); border-radius:9px;
    padding:9px 11px; color:var(--text); font-size:13.5px; outline:none; font-family:'Inter';
  }
  .field input:focus, .field select:focus{border-color:#463d63;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0 3px;}
  .toggle-row label{font-size:13px; font-weight:600; color:var(--text);}
  .switch{position:relative; width:38px; height:22px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.15s;}
  .slider:before{content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--gold);}
  .switch input:checked + .slider:before{transform:translateX(16px);}
  .shiny-block{display:none; background:var(--bg-deep); border:1px solid var(--line-soft); border-radius:11px; padding:11px; margin-top:6px;}
  .shiny-block.show{display:block;}

  .stat-editor .stat-line{display:grid; grid-template-columns:1fr 90px 30px; gap:7px; margin-bottom:7px;}
  .icon-btn{
    background:var(--bg-deep); border:1px solid var(--line); border-radius:8px; color:var(--muted);
    cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{color:var(--danger); border-color:#4a2530;}
  .add-stat{
    width:100%; margin-top:2px; background:none; border:1px dashed var(--line); color:var(--muted);
    border-radius:9px; padding:8px; font-size:12.5px; cursor:pointer;
  }
  .add-stat:hover{color:var(--text); border-color:#463d63;}

  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1; justify-content:center;}

  @media(max-width:760px){
    .sidebar{position:fixed; left:0; top:70px; bottom:0; z-index:40; transform:translateX(-100%); transition:.2s; box-shadow:20px 0 40px #0008;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:16px;}
    .rate-box{order:3; width:100%;}
    .search{width:140px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <button class="icon-btn" id="menuBtn" style="display:none; width:36px;height:36px;font-size:18px;">☰</button>
      <div class="brand-mark">WF</div>
      <div class="brand-text">
        <h1>Weapon Factory</h1>
        <span>Community Value List</span>
      </div>
    </div>
    <div class="rate-box">
      <label>1 Token =</label>
      <input id="tokenRateInput" class="num" type="text" value="25B">
      <span class="eq">gems</span>
      <span class="rate-chip" id="rateEcho">= 25,000,000,000</span>
    </div>
    <button class="btn btn-gold" id="addItemBtn">+ Add Item</button>
  </div>

  <div class="body-grid">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="main-head">
        <div>
          <div class="crumb" id="crumb">Category / Subcategory</div>
          <h2 id="sectionTitle">All Items</h2>
        </div>
        <div class="head-actions">
          <input class="search" id="searchInput" placeholder="Search items…">
        </div>
      </div>
      <div id="gridWrap"></div>
    </div>
  </div>
</div>

<div class="tip" id="tip"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Add Item</h3>
    <form id="itemForm">
      <div class="field">
        <label>Item name</label>
        <input id="f_name" required placeholder="e.g. Frostbite Blade">
      </div>
      <div class="row2">
        <div class="field">
          <label>Category</label>
          <select id="f_cat"></select>
        </div>
        <div class="field">
          <label>Subcategory</label>
          <select id="f_subcat"></select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Value — Tokens</label>
          <input id="f_tokens" class="num" type="text" value="0" placeholder="0">
        </div>
        <div class="field">
          <label>Value — Flat gems</label>
          <input id="f_gems" class="num" type="text" value="0" placeholder="0">
        </div>
      </div>

      <div class="toggle-row" id="shinyToggleRow">
        <label>Has a Shiny version</label>
        <label class="switch"><input type="checkbox" id="f_hasShiny"><span class="slider"></span></label>
      </div>
      <div class="shiny-block" id="shinyBlock">
        <div class="row2">
          <div class="field" style="margin-bottom:0;">
            <label>Shiny — Tokens</label>
            <input id="f_shinyTokens" class="num" type="text" value="0">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Shiny — Flat gems</label>
            <input id="f_shinyGems" class="num" type="text" value="0">
          </div>
        </div>
      </div>

      <div class="field stat-editor" style="margin-top:14px;">
        <label>Stats (shown on hover — money, xp, gems×, luck, etc.)</label>
        <div id="statLines"></div>
        <button type="button" class="add-stat" id="addStatBtn">+ Add stat</button>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-gold">Save item</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ============================= DATA MODEL ============================= */
const CATEGORIES = {
  weapons: {
    label:"Weapons", accent:"var(--c-weapons)",
    subcats:{
      secret:{label:"Secret"},
      limited:{label:"Limited"},
    }
  },
  items: {
    label:"Items", accent:"var(--c-items)",
    subcats:{
      healing:{label:"Healing"},
      boosts:{label:"Boosts"},
      candies:{label:"Candies"},
      crafting_items:{label:"Crafting Items"},
      consumables:{label:"Consumables"},
      enchant_stones:{label:"Enchant Stones"},
      item_packs:{label:"Item Packs"},
    }
  },
  cards: {
    label:"Cards", accent:"var(--c-cards)",
    subcats:{
      pack1:{label:"#1 · Crimson Swirl", swatch:"#d63447"},
      pack2:{label:"#2 · Amethyst Geode", swatch:"#8b5fbf"},
      pack3:{label:"#3 · Midnight Forest", swatch:"#1f3d3a"},
      pack4:{label:"#4 · Jungle Canopy", swatch:"#3f9142"},
      pack5:{label:"#5 · Cherry Blossom", swatch:"#f2a7c3"},
      pack6:{label:"#6 · Shadow Pines", swatch:"#16241c"},
      pack7:{label:"#7 · Garden Harvest", swatch:"#8a5a2b"},
      pack8:{label:"#8 · Toybox", swatch:"#e8c9a0"},
      pack9:{label:"#9 · Circuit", swatch:"#1f9aa0"},
      pack10:{label:"#10 · Snowfall", swatch:"#a9b7c0"},
      pack11:{label:"#11 · Mushroom Grove", swatch:"#6b3fa0"},
      pack12:{label:"#12 · Fossil Dig", swatch:"#c9a66b"},
      pack13:{label:"#13 · Volcano", swatch:"#c0392b"},
      pack14:{label:"#14 · Clear Skies", swatch:"#bcdff2"},
      pack15:{label:"#15 · Chocolate Bar", swatch:"#5c3a21"},
      pack16:{label:"#16 · Deep Ocean", swatch:"#3f8fd6"},
      pack17:{label:"#17 · Candy Shop", swatch:"#f2a7c3"},
      pack18:{label:"#18 · Haunted Manor", swatch:"#3b1f5c"},
      pack19:{label:"#19 · Bakery", swatch:"#f4b6c2"},
      pack20:{label:"#20 · Flower Bouquet", swatch:"#7cb342"},
      pack21:{label:"#21 · Crystal Cave", swatch:"#1f4e4a"},
      admin:{label:"Admin · Picnic", swatch:"#8a5a2b"},
      exclusive1:{label:"Exclusive · Galaxy", swatch:"#4b2e83"},
      exclusive2:{label:"Exclusive · Pearl Shore", swatch:"#d8c39a"},
      exclusive3:{label:"Exclusive · Stardust", swatch:"#dfe7ec"},
      exclusive4:{label:"Exclusive · Champion", swatch:"#f0b429"},
      exclusive5:{label:"Exclusive · Void", swatch:"#0c1445"},
    }
  },
  artifacts: {
    label:"Artifacts", accent:"var(--c-artifacts)",
    subcats:{
      tier1:{label:"Tier I"}, tier2:{label:"Tier II"}, tier3:{label:"Tier III"},
      tier4:{label:"Tier IV"}, tier5:{label:"Tier V"}, tier6:{label:"Tier VI"},
      tier7:{label:"Tier VII"}, tier8:{label:"Tier VIII"}, tier9:{label:"Tier IX"},
      tier10:{label:"Tier X"},
    }
  }
};

const DEFAULT_ITEMS = [
  {id:"seed1", name:"Enchant Artifact", category:"artifacts", subcat:"tier1", tokens:0, gems:0, hasShiny:false, shinyTokens:0, shinyGems:0,
    stats:[{label:"Enchant Power",value:"x1"}]},
  {id:"seed2", name:"Diamond Artifact", category:"artifacts", subcat:"tier1", tokens:0, gems:0, hasShiny:false, shinyTokens:0, shinyGems:0,
    stats:[{label:"Money",value:"x50"},{label:"Luck",value:"x2"}]},
];

let state = {
  tokenRate: 25_000_000_000,
  items: DEFAULT_ITEMS.slice(),
};
let currentCat = "weapons";
let currentSubcat = null;
let editingId = null;

/* ============================= PERSISTENCE ============================= */
function loadState(){
  try{
    const saved = localStorage.getItem('wf-valuelist');
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed && Array.isArray(parsed.items)){
        state.tokenRate = parsed.tokenRate || state.tokenRate;
        state.items = parsed.items;
      }
    }
  }catch(e){ console.error('Load failed', e); }
  renderAll();
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem('wf-valuelist', JSON.stringify(state));
    }catch(e){ console.error('Save failed', e); }
  }, 250);
}

/* ============================= NUMBER HELPERS ============================= */
const SUFFIXES = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmtNum(n){
  n = Number(n)||0;
  const neg = n<0; n=Math.abs(n);
  if(n<1000) return (neg?'-':'') + (Number.isInteger(n)? n : n.toFixed(2));
  let tier = Math.floor(Math.log10(n)/3);
  tier = Math.min(tier, SUFFIXES.length-1);
  const scaled = n / Math.pow(10,tier*3);
  const dec = scaled<10?2:(scaled<100?1:0);
  return (neg?'-':'') + scaled.toFixed(dec) + SUFFIXES[tier];
}
function parseAbbrev(str){
  if(typeof str === 'number') return str;
  if(!str) return 0;
  str = str.toString().trim().replace(/,/g,'');
  const m = str.match(/^(-?[\d.]+)\s*([A-Za-z]*)$/);
  if(!m) return parseFloat(str)||0;
  const num = parseFloat(m[1]);
  const suf = m[2].charAt(0).toUpperCase() + m[2].slice(1);
  const idx = SUFFIXES.findIndex(s=>s.toLowerCase()===suf.toLowerCase());
  if(!m[2]) return num;
  if(idx>0) return num*Math.pow(10, idx*3);
  return num;
}
function itemGemValue(item, shiny=false){
  const tok = shiny? (item.shinyTokens||0) : (item.tokens||0);
  const gem = shiny? (item.shinyGems||0) : (item.gems||0);
  return tok*state.tokenRate + gem;
}

/* ============================= RENDER: SIDEBAR ============================= */
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML='';
  Object.entries(CATEGORIES).forEach(([catKey,cat])=>{
    const group = document.createElement('div');
    group.className='cat-group' + (catKey===currentCat?' open':'');
    const btn = document.createElement('button');
    btn.className='cat-btn' + (catKey===currentCat && !currentSubcat ? ' active':'');
    btn.innerHTML = `<span class="dot" style="background:${cat.accent}"></span>${cat.label}`;
    btn.onclick = ()=>{ currentCat=catKey; currentSubcat=null; renderSidebar(); renderMain(); };
    group.appendChild(btn);

    const list = document.createElement('div');
    list.className='subcat-list';
    Object.entries(cat.subcats).forEach(([subKey,sub])=>{
      const count = state.items.filter(i=>i.category===catKey && i.subcat===subKey).length;
      const sbtn = document.createElement('button');
      sbtn.className='subcat-btn' + (catKey===currentCat && currentSubcat===subKey ? ' active':'');
      sbtn.innerHTML = `<span>${sub.swatch? `<span class="swatch" style="background:${sub.swatch};display:inline-block;margin-right:6px;"></span>`:''}${sub.label}</span><span class="count">${count}</span>`;
      sbtn.onclick=(e)=>{ e.stopPropagation(); currentCat=catKey; currentSubcat=subKey; renderSidebar(); renderMain(); };
      list.appendChild(sbtn);
    });
    group.appendChild(list);
    sb.appendChild(group);
  });
}

/* ============================= RENDER: MAIN GRID ============================= */
function renderMain(){
  const cat = CATEGORIES[currentCat];
  const sub = currentSubcat ? cat.subcats[currentSubcat] : null;
  document.getElementById('crumb').textContent = cat.label + (sub? ' / ' + sub.label.replace(/^#\d+ · /,'').replace(/^Exclusive · /,'') : '');
  document.getElementById('sectionTitle').textContent = sub ? sub.label : cat.label;

  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  let items = state.items.filter(i=>i.category===currentCat && (!currentSubcat || i.subcat===currentSubcat));
  if(query) items = items.filter(i=>i.name.toLowerCase().includes(query));

  const wrap = document.getElementById('gridWrap');
  wrap.innerHTML='';
  if(items.length===0){
    wrap.innerHTML = `<div class="empty-state"><b>Nothing here yet</b>No items saved in this ${sub? 'subcategory':'category'} yet. Hit “+ Add Item” to start filling it in.</div>`;
    return;
  }
  const grid = document.createElement('div');
  grid.className='grid';
  items.forEach(item=>{
    const total = itemGemValue(item,false);
    const card = document.createElement('div');
    card.className='card';
    card.style.setProperty('--accent', cat.accent);
    card.innerHTML = `
      <div class="badges">${item.hasShiny? '<span class="badge-shiny">✦ SHINY</span>':''}</div>
      <div class="card-name">${escapeHtml(item.name)}</div>
      <div class="card-values">
        <div class="val-row"><span class="lbl">Tokens</span><span class="amt amt-gold">${fmtNum(item.tokens||0)}</span></div>
        <div class="val-row"><span class="lbl">Gems</span><span class="amt amt-gem">${fmtNum(total)}</span></div>
      </div>
    `;
    card.addEventListener('mouseenter', (e)=>showTip(e,item));
    card.addEventListener('mousemove', positionTip);
    card.addEventListener('mouseleave', hideTip);
    card.addEventListener('click', ()=>openModal(item));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ============================= TOOLTIP ============================= */
const tipEl = document.getElementById('tip');
function showTip(e, item){
  let rows = (item.stats||[]).map(s=>`<div class="stat-row"><span>${escapeHtml(s.label)}</span><b>${escapeHtml(s.value)}</b></div>`).join('');
  if(!rows) rows = `<div class="none">No stats recorded yet</div>`;
  const total = itemGemValue(item,false);
  let shinyBlock = '';
  if(item.hasShiny){
    const sTotal = itemGemValue(item,true);
    shinyBlock = `<hr><div class="stat-row"><span>✦ Shiny tokens</span><b>${fmtNum(item.shinyTokens||0)}</b></div>
      <div class="total"><span>✦ Shiny value</span><b>${fmtNum(sTotal)} gems</b></div>`;
  }
  tipEl.innerHTML = `
    <h4>${escapeHtml(item.name)}</h4>
    ${rows}
    <hr>
    <div class="stat-row"><span>Tokens</span><b>${fmtNum(item.tokens||0)}</b></div>
    <div class="stat-row"><span>Flat gems</span><b>${fmtNum(item.gems||0)}</b></div>
    <div class="total"><span>Total value</span><b>${fmtNum(total)} gems</b></div>
    ${shinyBlock}
  `;
  tipEl.classList.add('show');
  positionTip(e);
}
function positionTip(e){
  const pad=16;
  let x = e.clientX + pad, y = e.clientY + pad;
  const rect = {w:238,h:tipEl.offsetHeight||140};
  if(x + rect.w > window.innerWidth) x = e.clientX - rect.w - pad;
  if(y + rect.h > window.innerHeight) y = e.clientY - rect.h - pad;
  tipEl.style.left = x+'px'; tipEl.style.top = y+'px';
}
function hideTip(){ tipEl.classList.remove('show'); }

/* ============================= MODAL ============================= */
const overlay = document.getElementById('overlay');
const form = document.getElementById('itemForm');
let statLines = [];

function populateCatSelects(){
  const catSel = document.getElementById('f_cat');
  catSel.innerHTML = Object.entries(CATEGORIES).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('');
  catSel.onchange = ()=>populateSubSelect(catSel.value);
}
function populateSubSelect(catKey){
  const subSel = document.getElementById('f_subcat');
  const cat = CATEGORIES[catKey];
  subSel.innerHTML = Object.entries(cat.subcats).map(([k,s])=>`<option value="${k}">${s.label}</option>`).join('');
  document.getElementById('shinyToggleRow').style.display = catKey==='weapons' ? 'flex':'none';
  if(catKey!=='weapons'){ document.getElementById('f_hasShiny').checked=false; toggleShinyBlock(false); }
}
document.getElementById('f_hasShiny').addEventListener('change', e=>toggleShinyBlock(e.target.checked));
function toggleShinyBlock(show){ document.getElementById('shinyBlock').classList.toggle('show', show); }

function renderStatLines(){
  const wrap = document.getElementById('statLines');
  wrap.innerHTML='';
  statLines.forEach((s,idx)=>{
    const line = document.createElement('div');
    line.className='stat-line';
    line.innerHTML = `
      <input placeholder="Stat (e.g. Money)" value="${escapeHtml(s.label)}" data-idx="${idx}" data-f="label">
      <input placeholder="e.g. x200" value="${escapeHtml(s.value)}" data-idx="${idx}" data-f="value">
      <button type="button" class="icon-btn" data-remove="${idx}">✕</button>
    `;
    wrap.appendChild(line);
  });
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i=+e.target.dataset.idx, f=e.target.dataset.f;
      statLines[i][f]=e.target.value;
    });
  });
  wrap.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', ()=>{ statLines.splice(+b.dataset.remove,1); renderStatLines(); });
  });
}
document.getElementById('addStatBtn').onclick = ()=>{ statLines.push({label:'',value:''}); renderStatLines(); };

function openModal(item){
  editingId = item ? item.id : null;
  document.getElementById('modalTitle').textContent = item ? 'Edit item' : 'Add item';
  document.getElementById('deleteBtn').style.display = item ? 'inline-flex' : 'none';
  populateCatSelects();

  const cat = item ? item.category : currentCat;
  document.getElementById('f_cat').value = cat;
  populateSubSelect(cat);
  document.getElementById('f_subcat').value = item ? item.subcat : (currentSubcat || Object.keys(CATEGORIES[cat].subcats)[0]);

  document.getElementById('f_name').value = item ? item.name : '';
  document.getElementById('f_tokens').value = item ? item.tokens : 0;
  document.getElementById('f_gems').value = item ? item.gems : 0;
  document.getElementById('f_hasShiny').checked = item ? !!item.hasShiny : false;
  document.getElementById('f_shinyTokens').value = item ? (item.shinyTokens||0) : 0;
  document.getElementById('f_shinyGems').value = item ? (item.shinyGems||0) : 0;
  toggleShinyBlock(item ? !!item.hasShiny : false);

  statLines = item && item.stats ? item.stats.map(s=>({...s})) : [];
  renderStatLines();

  overlay.classList.add('show');
}
function closeModal(){ overlay.classList.remove('show'); editingId=null; }
document.getElementById('cancelBtn').onclick = closeModal;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

document.getElementById('deleteBtn').onclick = ()=>{
  if(!editingId) return;
  state.items = state.items.filter(i=>i.id!==editingId);
  saveState(); closeModal(); renderAll();
};

form.addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  if(!name) return;
  const payload = {
    id: editingId || ('item_'+Date.now()+Math.random().toString(36).slice(2,7)),
    name,
    category: document.getElementById('f_cat').value,
    subcat: document.getElementById('f_subcat').value,
    tokens: parseAbbrev(document.getElementById('f_tokens').value),
    gems: parseAbbrev(document.getElementById('f_gems').value),
    hasShiny: document.getElementById('f_hasShiny').checked,
    shinyTokens: parseAbbrev(document.getElementById('f_shinyTokens').value),
    shinyGems: parseAbbrev(document.getElementById('f_shinyGems').value),
    stats: statLines.filter(s=>s.label.trim()!=='' || s.value.trim()!=='')
  };
  if(editingId){
    const i = state.items.findIndex(x=>x.id===editingId);
    state.items[i] = payload;
  }else{
    state.items.push(payload);
  }
  saveState();
  currentCat = payload.category; currentSubcat = payload.subcat;
  closeModal(); renderAll();
});

document.getElementById('addItemBtn').onclick = ()=>openModal(null);

/* ============================= TOKEN RATE ============================= */
const rateInput = document.getElementById('tokenRateInput');
function commitRate(){
  const val = parseAbbrev(rateInput.value);
  state.tokenRate = val>0?val:state.tokenRate;
  rateInput.value = fmtNum(state.tokenRate);
  document.getElementById('rateEcho').textContent = '= ' + Math.round(state.tokenRate).toLocaleString();
  saveState();
  renderMain();
}
rateInput.addEventListener('change', commitRate);
rateInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); rateInput.blur(); }});

/* ============================= SEARCH ============================= */
document.getElementById('searchInput').addEventListener('input', renderMain);

/* ============================= MOBILE MENU ============================= */
const menuBtn = document.getElementById('menuBtn');
const sidebarEl = document.getElementById('sidebar');
function checkMobile(){
  const mobile = window.innerWidth<=760;
  menuBtn.style.display = mobile? 'flex':'none';
}
menuBtn.addEventListener('click', ()=>sidebarEl.classList.toggle('open'));
window.addEventListener('resize', checkMobile);
checkMobile();

/* ============================= INIT ============================= */
function renderAll(){
  rateInput.value = fmtNum(state.tokenRate);
  document.getElementById('rateEcho').textContent = '= ' + Math.round(state.tokenRate).toLocaleString();
  renderSidebar();
  renderMain();
}
loadState();
</script>
</body>
</html>
